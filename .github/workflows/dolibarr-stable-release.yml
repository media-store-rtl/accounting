name: Dolibarr stable release watcher

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dolibarr-stable-release-watcher
  cancel-in-progress: false

jobs:
  propose-stable-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest official stable release and open a PR if needed
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const response = await fetch('https://api.github.com/repos/Dolibarr/dolibarr/releases/latest', {
              headers: { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
            });
            if (!response.ok) throw new Error('Unable to read Dolibarr latest release: HTTP ' + response.status);
            const release = await response.json();
            if (release.draft || release.prerelease || !release.tag_name) {
              core.info('No published stable release returned; nothing to propose.');
              return;
            }

            const base = (await github.rest.repos.get({ owner, repo })).data.default_branch;
            const path = 'dolibarr/UPSTREAM.md';
            let current = null;
            try {
              current = (await github.rest.repos.getContent({ owner, repo, path, ref: base })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const existing = current ? Buffer.from(current.content, 'base64').toString('utf8') : '';
            const match = existing.match(/Current tracked stable release: ([^\n]+)/);
            const currentTag = match ? match[1].trim() : null;
            if (currentTag === release.tag_name) {
              core.info('Dolibarr ' + release.tag_name + ' is already tracked.');
              return;
            }

            const safeTag = release.tag_name.replace(/[^0-9A-Za-z._-]/g, '-');
            const branch = 'automation/dolibarr-stable-' + safeTag;
            try {
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/heads/' + branch,
                sha: (await github.rest.repos.getBranch({ owner, repo, branch: base })).data.commit.sha
              });
            } catch (error) {
              if (error.status !== 422) throw error;
              core.info('Branch already exists; checking for an existing proposal.');
            }

            const body = [
              '# Dolibarr upstream tracking',
              '',
              'Official stable release tracking for the Dolibarr source repository.',
              '',
              '- Repository: https://github.com/Dolibarr/dolibarr',
              '- Release policy: stable only',
              '- Review policy: Pull Request; no auto-merge',
              '- Current tracked stable release: ' + release.tag_name,
              '- Release page: ' + release.html_url,
              '',
              '## Scope',
              '',
              'This workflow updates tracking metadata only. It does not download, replace, merge, or deploy Dolibarr source code. Prepare source synchronization separately under dolibarr/upstream/ and validate compatibility, installation, upgrade, API, and tenant isolation before proposing that change.',
              '',
              'Never treat this release-detection PR as proof that the Dolibarr source tree has been upgraded.'
            ].join('\n');

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: 'chore(dolibarr): track stable release ' + release.tag_name,
              content: Buffer.from(body).toString('base64'),
              ...(current ? { sha: current.sha } : {})
            });

            const open = await github.rest.pulls.list({
              owner, repo, state: 'open', head: owner + ':' + branch, base
            });
            if (open.data.length) {
              core.info('Tracking PR already exists: #' + open.data[0].number);
              return;
            }
            const pr = await github.rest.pulls.create({
              owner, repo, head: branch, base,
              title: 'chore(dolibarr): review stable release ' + release.tag_name,
              body: [
                'A new official stable Dolibarr release was detected: **' + release.tag_name + '**.',
                '',
                '- Release notes: ' + release.html_url,
                '- Previous tracked release: ' + (currentTag || 'not recorded'),
                '- Scope: tracking metadata only; this PR does not import or deploy upstream source code.',
                '- Next step: review the release, then prepare a separate source-sync PR with tests.',
                '',
                'This PR must not be auto-merged.'
              ].join('\n')
            });
            core.info('Opened stable release tracking PR #' + pr.data.number);
