name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - name: Prepare clean Laravel test environment
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views
          mkdir -p database
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite

      - name: Run migrations against clean SQLite database
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Check formatting
        run: git diff --check

      - name: Run Backup / Restore / Excel PHPUnit scope
        run: php artisan test tests/Feature/BackupImportFeatureTest.php
