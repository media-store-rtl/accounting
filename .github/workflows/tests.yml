name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: |
          cp .env.example .env
          php -r '$env = file_get_contents(".env"); $key = "base64:".base64_encode(random_bytes(32)); $env = preg_replace("/^APP_KEY=.*$/m", "APP_KEY=".$key, $env, 1); file_put_contents(".env", $env);'
      - run: touch database/database.sqlite
      - name: Check SQLite migrations
        run: php artisan migrate --force --no-interaction
      - name: SetupTest
        run: php artisan test tests/Feature/SetupTest.php --no-interaction
