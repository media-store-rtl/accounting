deployment:
  tasks:
    - export DEPLOYPATH=/home/mediast1/accounting/
    - export PATH=/home/mediast1/.nvm/versions/node/v22.14.0/bin:$PATH
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/tar -cf - --exclude='./.git' --exclude='./.env' --exclude='./storage' --exclude='./public/storage' . | /bin/tar -xf - -C $DEPLOYPATH
    - cd $DEPLOYPATH && composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
    - cd $DEPLOYPATH && npm ci
    - cd $DEPLOYPATH && npm run build
    - cd $DEPLOYPATH && mkdir -p storage/app storage/framework/cache storage/framework/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
    - cd $DEPLOYPATH && test -f .env || cp .env.example .env
    - cd $DEPLOYPATH && grep -q '^APP_KEY=$' .env && php artisan key:generate --force || true
    - cd $DEPLOYPATH && php artisan optimize:clear
    - cd $DEPLOYPATH && php artisan migrate --force
